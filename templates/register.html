{% extends "base.html" %}
{% block title %}Create Account – MailShield{% endblock %}

{% block content %}
<div style="min-height:70vh; display:flex; align-items:center; justify-content:center; padding:2rem 1rem;">
    <div style="width:100%; max-width:420px;">

        <!-- Logo -->
        <div style="text-align:center; margin-bottom:2rem;">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🛡️</div>
            <h1 style="font-size:1.5rem; font-weight:800; color:#f1f5f9; margin-bottom:0.25rem;">Create your account</h1>
            <p style="color:#64748b; font-size:0.9rem; margin:0;">Free — takes less than a minute</p>
        </div>

        <!-- Form -->
        <div class="card-box" style="padding:2rem;">
            <form method="POST" action="{{ url_for('auth.register') }}">

                <div style="margin-bottom:1.1rem;">
                    <label for="username" style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">Username</label>
                    <input type="text" id="username" name="username"
                           value="{{ username or '' }}"
                           class="form-control"
                           placeholder="Choose a username"
                           autofocus required minlength="3"
                           style="font-size:0.95rem; padding:0.75rem 1rem;">
                </div>

                <div style="margin-bottom:1.1rem;">
                    <label for="email" style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">Email Address</label>
                    <input type="email" id="email" name="email"
                           value="{{ email or '' }}"
                           class="form-control"
                           placeholder="you@example.com"
                           required
                           style="font-size:0.95rem; padding:0.75rem 1rem;">
                </div>

                <div style="margin-bottom:1.1rem;">
                    <label for="password" style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-control"
                           placeholder="At least 6 characters"
                           required minlength="6"
                           style="font-size:0.95rem; padding:0.75rem 1rem;">
                </div>

                <div style="margin-bottom:1.75rem;">
                    <label for="confirm_password" style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password"
                           class="form-control"
                           placeholder="Re-enter password"
                           required minlength="6"
                           style="font-size:0.95rem; padding:0.75rem 1rem;">
                </div>

                <button type="submit"
                        style="width:100%; background:#3b82f6; color:#fff; border:none; border-radius:12px; padding:0.9rem; font-size:1rem; font-weight:700; cursor:pointer; transition:background 0.15s;">
                    Create Account →
                </button>
            </form>

            <div style="text-align:center; margin-top:1.5rem; padding-top:1.25rem; border-top:1px solid #1e2330;">
                <span style="font-size:0.875rem; color:#64748b;">Already have an account? </span>
                <a href="{{ url_for('auth.login') }}" style="color:#3b82f6; font-weight:600; text-decoration:none; font-size:0.875rem;">Sign in</a>
            </div>
        </div>

    </div>
</div>
{% endblock %}
