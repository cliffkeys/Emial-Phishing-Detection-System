{% extends "base.html" %}
{% block title %}Scan Email – MailShield{% endblock %}

{% block content %}
<div style="max-width:720px; margin:0 auto; padding:2rem 1.5rem;">

    <!-- Page Title -->
    <div style="margin-bottom:2rem;">
        <h2 style="font-size:1.6rem; font-weight:800; color:#f1f5f9; margin-bottom:0.3rem;">
            <i class="fa-solid fa-magnifying-glass" style="color:#3b82f6; margin-right:0.5rem;"></i>
            Scan an Email
        </h2>
        <p style="color:#64748b; font-size:0.9rem; margin:0;">
            Fill in the email details below, then click <strong style="color:#f1f5f9;">Run Scan</strong>.
        </p>
    </div>

    <!-- Demo Presets (collapsed accordion) -->
    <div class="card-box" style="margin-bottom:1.5rem; overflow:hidden;">
        <button onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? 'block' : 'none'"
                style="width:100%; background:none; border:none; color:#f1f5f9; padding:1rem 1.25rem; text-align:left; cursor:pointer; font-size:0.9rem; font-weight:600; display:flex; align-items:center; gap:0.5rem;">
            <i class="fa-solid fa-flask" style="color:#3b82f6;"></i>
            Load a demo email to test
            <span style="margin-left:auto; color:#64748b; font-size:0.8rem;">▼ click to expand</span>
        </button>
        <div style="display:none; padding:0 1.25rem 1.25rem; display:none;">
            <div style="display:flex; flex-wrap:wrap; gap:0.5rem; padding-top:0.75rem; border-top:1px solid #1e2330;">
                <button data-demo-sample="legit_meeting"  class="demo-preset-btn" style="background:#14532d33; border:1px solid #22c55e55; color:#86efac; padding:0.4rem 0.9rem; border-radius:8px; font-size:0.8rem; cursor:pointer; font-weight:600;">✅ Safe Email</button>
                <button data-demo-sample="promo_spam"     class="demo-preset-btn" style="background:#78350f33; border:1px solid #f59e0b55; color:#fde68a; padding:0.4rem 0.9rem; border-radius:8px; font-size:0.8rem; cursor:pointer; font-weight:600;">📢 Spam</button>
                <button data-demo-sample="ms_phishing"    class="demo-preset-btn" style="background:#7f1d1d33; border:1px solid #ef444455; color:#fca5a5; padding:0.4rem 0.9rem; border-radius:8px; font-size:0.8rem; cursor:pointer; font-weight:600;">🎣 Phishing (Microsoft)</button>
                <button data-demo-sample="paypal_spoof"   class="demo-preset-btn" style="background:#7f1d1d33; border:1px solid #ef444455; color:#fca5a5; padding:0.4rem 0.9rem; border-radius:8px; font-size:0.8rem; cursor:pointer; font-weight:600;">🎣 Phishing (PayPal)</button>
                <button data-demo-sample="malware_invoice" class="demo-preset-btn" style="background:#7f1d1d33; border:1px solid #ef444455; color:#fca5a5; padding:0.4rem 0.9rem; border-radius:8px; font-size:0.8rem; cursor:pointer; font-weight:600;">💀 Malware Attachment</button>
                <button data-demo-sample="raw_rfc"        class="demo-preset-btn" style="background:#1e3a5f33; border:1px solid #3b82f655; color:#93c5fd; padding:0.4rem 0.9rem; border-radius:8px; font-size:0.8rem; cursor:pointer; font-weight:600;">📄 Raw MIME Source</button>
            </div>
        </div>
    </div>

    <!-- Main Form -->
    <div class="card-box" style="padding:2rem;">
        <form method="POST" action="{{ url_for('analyze') }}" id="emailAnalysisForm">
            <input type="hidden" name="input_mode" id="input_mode" value="form">

            <!-- STEP 1: Sender -->
            <div style="margin-bottom:1.25rem;">
                <label for="sender" style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">
                    <i class="fa-solid fa-user me-1"></i> Sender (From)
                </label>
                <input type="text" id="sender" name="sender" class="form-control"
                       placeholder='e.g. Microsoft Security &lt;support@microsoft.com&gt;'
                       style="font-size:0.95rem; padding:0.75rem 1rem;">
            </div>

            <!-- STEP 2: Subject -->
            <div style="margin-bottom:1.25rem;">
                <label for="subject" style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">
                    <i class="fa-solid fa-tag me-1"></i> Subject Line
                </label>
                <input type="text" id="subject" name="subject" class="form-control"
                       placeholder="e.g. URGENT: Your account will be suspended"
                       style="font-size:0.95rem; padding:0.75rem 1rem;">
            </div>

            <!-- STEP 3: Body -->
            <div style="margin-bottom:1.25rem;">
                <label for="body" style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">
                    <i class="fa-solid fa-envelope-open-text me-1"></i> Email Body
                    <span style="font-weight:400; color:#475569; margin-left:0.4rem;">— paste the email content here</span>
                </label>
                <textarea id="body" name="body" class="form-control" rows="8"
                          placeholder="Paste the full email text here..."
                          style="font-size:0.9rem; padding:0.75rem 1rem; resize:vertical;"></textarea>
            </div>

            <!-- Optional: Attachments -->
            <div style="margin-bottom:1rem;">
                <label for="attachments" style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">
                    <i class="fa-solid fa-paperclip me-1"></i> Attachments
                    <span style="font-weight:400; color:#475569; margin-left:0.3rem;">— optional, type file names</span>
                </label>
                <input type="text" id="attachments" name="attachments" class="form-control"
                       placeholder="e.g. invoice.pdf.exe, document.docm"
                       style="font-size:0.9rem; padding:0.7rem 1rem;">
            </div>

            <!-- Advanced: Raw MIME toggle -->
            <div style="margin-bottom:1.75rem;">
                <button type="button" onclick="toggleRaw()"
                        style="background:none; border:none; color:#64748b; font-size:0.8rem; cursor:pointer; padding:0; font-weight:500;">
                    <i class="fa-solid fa-code me-1"></i> Have the raw email source instead? Click here →
                </button>
                <div id="rawSection" style="display:none; margin-top:1rem;">
                    <label style="display:block; font-size:0.875rem; font-weight:600; color:#64748b; margin-bottom:0.4rem;">
                        Raw RFC 822 / MIME Email
                    </label>
                    <textarea id="raw_email" name="raw_email" class="form-control" rows="10"
                              placeholder="Paste the complete raw email source (From:, To:, Subject:, headers, and body)..."
                              style="font-family:monospace; font-size:0.8rem; resize:vertical;"></textarea>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="submitBtn"
                    style="width:100%; background:#3b82f6; color:#fff; border:none; border-radius:12px; padding:0.95rem; font-size:1.05rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:0.6rem; transition:background 0.15s;">
                <i class="fa-solid fa-shield-halved"></i>
                Run Scan
            </button>
        </form>
    </div>

    <!-- Privacy note -->
    <p style="text-align:center; margin-top:1rem; font-size:0.78rem; color:#475569;">
        <i class="fa-solid fa-lock me-1"></i>
        All analysis runs locally. URLs are never fetched — only inspected structurally.
    </p>
</div>

<script>
function toggleRaw() {
    const sec = document.getElementById('rawSection');
    const mode = document.getElementById('input_mode');
    if (sec.style.display === 'none') {
        sec.style.display = 'block';
        mode.value = 'raw';
    } else {
        sec.style.display = 'none';
        mode.value = 'form';
    }
}

// Demo preset buttons — expand panel on click
document.querySelectorAll('.demo-preset-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const panel = this.closest('.card-box').querySelector('div:last-child');
        // keep panel visible after selection
    });
});

// Expand demo panel toggle
const toggleBtn = document.querySelector('[onclick*="nextElementSibling"]');
if (toggleBtn) {
    toggleBtn.addEventListener('click', function() {
        const panel = this.nextElementSibling;
        if (panel.style.display === 'none' || panel.style.display === '') {
            panel.style.display = 'block';
        } else {
            panel.style.display = 'none';
        }
    });
}
</script>
{% endblock %}
